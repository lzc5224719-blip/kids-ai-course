<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>我的工坊</title>
<style>/* 工坊首页视觉重构 v1 —— 框架图底 + 真实 DOM 覆盖（坐标来自 layout.json 实测）
   舞台：9:16 固定比例，居中，其他屏幕比例补 #F0DFC2（框架边缘色）
   页签：纯 CSS radio 切换，零 JS 依赖 */
[hidden]{display:none!important;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#F0DFC2;
  --card:#FFFBF2; --card-soft:#FBF3E2;
  --ink:#5B4636; --sub:#9A866E; --line:#E7D9BE;
  --brown:#A9744E; --brown-d:#8A5A3A;
  --gold:#D9AE6A; --gold-d:#B67B2E;
  --orange:#C76D32; --gray:#B8A98F;
  --border-d:#6E4F2E;
}
html,body{height:100%;}
body{
  font-family:"PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  color:var(--ink);
  background:var(--bg);
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  overflow:hidden;
}
.app{
  width:min(100vw, calc(100vh * 9 / 16));
  height:min(100vh, calc(100vw * 16 / 9));
  position:relative;
  background:url('/assets/frames/frame-workshop.png') center / 100% 100% no-repeat;
  container-type:size;
  overflow:hidden;
}
#main{position:absolute;inset:0;}
button{cursor:pointer;font-family:inherit;}
button:focus-visible,label:focus-visible{outline:2px dashed var(--gold-d);outline-offset:2px;}

/* ===== 顶栏：伙伴圆头像 / 品牌名 / 积分药丸（盖在框架图顶栏上） ===== */
.top-avatar{
  position:absolute;left:4.6%;top:3.3%;width:11.8cqw;aspect-ratio:1;
  border-radius:50%;overflow:hidden;background:#F1E6CE;
}
.top-avatar img{width:100%;height:100%;object-fit:cover;object-position:center 8%;}
.brand{
  position:absolute;left:21%;top:2.75%;width:51%;height:7.54%;
  display:flex;align-items:center;justify-content:center;gap:.8cqh;
  font-size:2.5cqh;font-weight:700;color:var(--ink);
  white-space:nowrap;overflow:hidden;
}
.brand .home{font-size:1.7cqh;color:var(--sub);font-weight:400;}
.points-pill{
  position:absolute;left:73.65%;top:2.75%;width:23.49%;height:7.54%;
  display:flex;align-items:center;justify-content:center;
  font-size:2.2cqh;font-weight:700;color:var(--gold-d);white-space:nowrap;
}

/* ===== 页签：4 个 radio + label，盖在框架图页签框上 ===== */
.tab-r{position:absolute;width:0;height:0;opacity:0;pointer-events:none;}
.tabbar label{
  position:absolute;top:13.46%;height:2.2%;z-index:2;
  display:flex;align-items:center;justify-content:center;
  font-size:2.15cqh;font-weight:700;color:#8A7355;
  border-radius:999px;cursor:pointer;user-select:none;
}
.tabbar label[for=ws-tab-1]{left:4.57%;width:21.57%;}
.tabbar label[for=ws-tab-2]{left:29.12%;width:19.87%;}
.tabbar label[for=ws-tab-3]{left:52.07%;width:19.87%;}
.tabbar label[for=ws-tab-4]{left:75.03%;width:20.51%;}
#ws-tab-1:checked~.tabbar label[for=ws-tab-1],
#ws-tab-2:checked~.tabbar label[for=ws-tab-2],
#ws-tab-3:checked~.tabbar label[for=ws-tab-3],
#ws-tab-4:checked~.tabbar label[for=ws-tab-4]{
  background:var(--orange);color:#FFF6E8;
  box-shadow:0 .4cqh 1cqh rgba(199,109,50,.35);
}

/* ===== 页签面板区（对齐框架图 2×2 卡位外框） ===== */
.panels{position:absolute;left:4.25%;top:22.49%;width:91.61%;height:56.33%;}
.panel{display:none;position:absolute;inset:0;}
#ws-tab-1:checked~.panels .p-shelf{display:block;}
#ws-tab-2:checked~.panels .p-inbox{display:block;}
#ws-tab-3:checked~.panels .p-growth{display:block;}
#ws-tab-4:checked~.panels .p-partner{display:block;}
/* 非作品架面板：大纸板盖住框架卡位 */
.p-inbox,.p-growth,.p-partner{
  background:var(--card);border:2px solid var(--border-d);border-radius:2.2cqh;
  padding:1.6cqh 2.2cqh;overflow-y:auto;
  box-shadow:0 .8cqh 1.8cqh rgba(110,79,46,.14);
  scrollbar-width:thin;scrollbar-color:#D9C6A0 transparent;
}
.panel-title{font-size:2cqh;font-weight:700;color:var(--brown-d);margin-bottom:1cqh;}
.panel-hint{padding:4.5cqh 2cqh;text-align:center;font-size:1.8cqh;color:var(--gray);line-height:1.9;}
#inbox:not([hidden])~.panel-hint,
#growth:not([hidden])~.panel-hint{display:none;}

/* ===== 作品架：2×2 透明卡，盖在框架图卡位上 ===== */
.shelf{
  position:absolute;inset:0;display:grid;
  grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;
  column-gap:3.4cqw;row-gap:1.9cqh;
}
.work{
  display:flex;flex-direction:column;justify-content:center;gap:.9cqh;
  padding:2.4cqh 2.4cqh;cursor:pointer;border-radius:2cqh;
  transition:transform .12s;
}
.work:active{transform:scale(.97);}
.work.locked{opacity:.8;cursor:pointer;}
.work-icon{
  width:6.4cqh;height:6.4cqh;border-radius:1.6cqh;flex:none;
  display:flex;align-items:center;justify-content:center;
  font-size:3cqh;font-weight:700;color:#fff;
  box-shadow:0 .4cqh 1cqh rgba(60,42,26,.16);
}
.work.locked .work-icon{filter:grayscale(.45);opacity:.8;}
.work-title{font-size:2.6cqh;font-weight:800;color:var(--ink);line-height:1.25;}
.work-type{font-size:2cqh;color:var(--sub);line-height:1.35;}
.work-cat{
  align-self:flex-start;font-size:1.6cqh;font-weight:700;white-space:nowrap;
  padding:.3cqh 1.1cqh;border-radius:999px;border:1.5px solid currentColor;
}
.work-badge{
  align-self:flex-start;font-size:1.65cqh;font-weight:700;
  padding:.4cqh 1.2cqh;border-radius:999px;
}
.done .work-badge{background:#E3F0E4;color:#4E7A5F;}
.locked .work-badge{background:#F1E8D3;color:#9A866E;}

/* ===== 建议箱 / 成长档案列表（JS 动态生成 .inbox-item） ===== */
.inbox{display:flex;flex-direction:column;gap:1cqh;}
.inbox-item{background:var(--card-soft);border:1.5px solid var(--line);border-radius:1.6cqh;padding:1.1cqh 1.4cqh;}
.inbox-item .ii-text{font-size:1.85cqh;color:var(--ink);line-height:1.55;margin-bottom:.4cqh;}
.inbox-item .ii-sub{font-size:1.5cqh;color:var(--sub);}

/* ===== 成长积分条 ===== */
.progress-wrap{
  background:var(--card-soft);border:1.5px dashed #E7D2A8;border-radius:1.6cqh;
  padding:1.3cqh 1.5cqh;margin-bottom:1.4cqh;
}
.progress-head{display:flex;justify-content:space-between;font-size:1.75cqh;color:var(--ink);margin-bottom:.8cqh;}
.progress-head b{color:var(--gold-d);}
.bar{height:1.1cqh;border-radius:999px;background:#EFE3C6;overflow:hidden;}
.bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--gold),var(--orange));transition:width .5s;}

/* ===== 我的伙伴面板 ===== */
.partner{display:flex;flex-direction:column;align-items:center;gap:1.3cqh;padding-top:.6cqh;}
.bubble{
  position:relative;max-width:92%;cursor:pointer;text-align:center;
  background:var(--card-soft);border:2px solid var(--border-d);border-radius:2cqh;
  padding:1cqh 1.6cqh;font-size:1.8cqh;line-height:1.55;color:var(--ink);
}
.bubble::before,.bubble::after{
  content:'';position:absolute;left:50%;transform:translateX(-50%);
  width:0;height:0;border-style:solid;
}
.bubble::before{bottom:-1.7cqh;border-width:1.2cqh 1cqh 0;border-color:var(--border-d) transparent transparent;}
.bubble::after{bottom:calc(-1.7cqh + 2.6px);border-width:1.2cqh 1cqh 0;border-color:var(--card-soft) transparent transparent;}
.bubble .hint{display:block;margin-top:.3cqh;font-size:1.35cqh;color:var(--gray);}
.partner-figure{cursor:pointer;text-align:center;}
.partner-figure img{
  height:15cqh;width:auto;object-fit:contain;
  animation:float 3s ease-in-out infinite;
  filter:drop-shadow(0 1cqh 1.4cqh rgba(110,79,46,.25));
}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-1cqh)}}
.name-tag{
  display:inline-flex;align-items:center;gap:.8cqh;margin-top:.4cqh;
  background:var(--card);border:1.5px solid var(--line);border-radius:999px;
  padding:.5cqh 1.5cqh;font-size:1.85cqh;font-weight:700;color:var(--ink);
}
.rarity-dot{width:1.2cqh;height:1.2cqh;border-radius:50%;}
#rarity-text{font-size:1.5cqh;color:var(--sub);font-weight:400;}
.crew{display:flex;gap:1cqh;justify-content:center;flex-wrap:wrap;}
.crew .avatar{
  width:6cqh;height:6cqh;border-radius:50%;overflow:hidden;
  background:#F1E6CE;border:2px solid var(--line);cursor:pointer;
}
.crew .avatar img{width:100%;height:100%;object-fit:cover;object-position:center 8%;}
.crew .avatar.current{border-color:var(--orange);box-shadow:0 0 0 .4cqh rgba(199,109,50,.2);}

/* ===== 底部双胶囊入口（盖在框架图胶囊上） ===== */
.entry-btn{
  position:absolute;top:85.29%;height:5.56%;z-index:2;
  background:transparent;border:none;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  line-height:1.1;
}
.entry-btn:active{transform:scale(.94);}
#btn-workbench{left:25.4%;width:23.49%;}
#btn-workbench span{display:block;font-size:2cqh;font-weight:800;color:var(--brown-d);line-height:1.15;white-space:nowrap;}
#btn-workbench small{display:block;font-size:1.6cqh;color:var(--sub);line-height:1.2;white-space:nowrap;}
#btn-takehome{left:51.43%;width:23.06%;font-size:2.2cqh;font-weight:800;color:var(--brown-d);}

/* ===== 无存档空状态 ===== */
.empty{
  position:absolute;inset:0;z-index:8;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:8cqh 8%;
}
.empty .ghost{font-size:7cqh;color:var(--gold);margin-bottom:2cqh;}
.empty p{font-size:2.2cqh;color:var(--sub);line-height:1.8;margin-bottom:3cqh;}
.btn-primary{
  border:none;border-radius:2cqh;padding:1.6cqh 4cqh;
  font-size:2.4cqh;font-weight:600;color:#fff;
  background:linear-gradient(135deg,var(--gold),var(--gold-d));
  box-shadow:0 .8cqh 1.8cqh rgba(182,123,46,.3);
}

/* ===== 带回家弹层 ===== */
.overlay{
  position:fixed;inset:0;background:rgba(60,42,26,.42);
  display:flex;align-items:center;justify-content:center;z-index:60;padding:18px;
}
.modal{
  background:#FFFBF0;border:1.5px solid var(--line);border-radius:22px;
  padding:20px;width:100%;max-width:430px;max-height:80vh;overflow:auto;
  box-shadow:0 12px 40px rgba(0,0,0,.22);
}
.modal h3{font-size:18px;font-weight:700;margin-bottom:10px;color:var(--ink);}
.modal p{font-size:14px;color:var(--sub);line-height:1.7;margin-bottom:12px;}
.code-box{
  background:#F5EEDF;border:1.5px solid var(--line);border-radius:12px;
  padding:12px;font-size:12px;font-family:monospace;word-break:break-all;
  max-height:120px;overflow:auto;margin-bottom:14px;color:var(--ink);
}
.modal .row{display:flex;gap:10px;}
.modal button{flex:1;border:none;border-radius:12px;padding:12px;font-size:14px;font-weight:600;cursor:pointer;}
.btn-copy{background:linear-gradient(135deg,#C98A4B,#A9744E);color:#fff;}
.btn-close{background:#F1E8D3;color:var(--ink);}
</style>
</head>
<body>
  <div class="app">

    <!-- 无存档 -->
    <div id="empty" class="empty" hidden>
      <div class="ghost">★</div>
      <p>这里还没有你的工坊。<br>先去认领一个属于你的 AI 小伙伴吧，<br>TA 会陪你把想法做成作品。</p>
      <button class="btn-primary" id="btn-go-claim">去认领我的小伙伴</button>
    </div>

    <!-- 有存档 -->
    <div id="main" hidden>
      <!-- 顶栏：伙伴圆头像 + 品牌名 + 积分药丸 -->
      <div class="top-avatar"><img id="top-avatar-img" alt="伙伴头像"></div>
      <div class="brand"><span id="brand-name">我的工坊</span><span class="home">· 家</span></div>
      <span class="points-pill" id="points-pill">★ 0</span>

      <!-- 页签：纯 CSS radio 切换（作品架/建议箱/成长档案/我的伙伴） -->
      <input class="tab-r" type="radio" name="ws-tab" id="ws-tab-1" checked>
      <input class="tab-r" type="radio" name="ws-tab" id="ws-tab-2">
      <input class="tab-r" type="radio" name="ws-tab" id="ws-tab-3">
      <input class="tab-r" type="radio" name="ws-tab" id="ws-tab-4">
      <div class="tabbar">
        <label for="ws-tab-1">作品架</label>
        <label for="ws-tab-2">建议箱</label>
        <label for="ws-tab-3">成长档案</label>
        <label for="ws-tab-4">我的伙伴</label>
      </div>

      <!-- 页签面板 -->
      <div class="panels">
        <section class="panel p-shelf">
          <div class="shelf" id="shelf"></div>
        </section>
        <section class="panel p-inbox">
          <div class="panel-title" id="inbox-title" hidden>💌 大家给我的建议</div>
          <div class="inbox" id="inbox" hidden></div>
          <div class="panel-hint">还没有收到建议。<br>把作品分享给朋友，听听大家怎么说～</div>
        </section>
        <section class="panel p-growth">
          <div class="progress-wrap">
            <div class="progress-head"><span>成长积分</span><b id="progress-num">0 / 240</b></div>
            <div class="bar"><i id="progress-fill" style="width:0%"></i></div>
          </div>
          <div class="panel-title" id="growth-title" hidden>📈 我的成长档案</div>
          <div class="inbox" id="growth" hidden></div>
          <div class="panel-hint">还没有成长记录。<br>去制作台跟伙伴说说想法，脚印就会留下来～</div>
        </section>
        <section class="panel p-partner">
          <div class="partner">
            <div class="bubble" id="bubble">
              <span id="bubble-text">……</span>
              <span class="hint">点我或点小伙伴，听 TA 说话</span>
            </div>
            <div class="partner-figure" id="partner-figure">
              <img id="partner-img" alt="伙伴立绘">
              <div class="name-tag"><span id="partner-name"></span><span class="rarity-dot" id="rarity-dot"></span><span id="rarity-text"></span></div>
            </div>
            <div class="crew" id="crew"></div>
          </div>
        </section>
      </div>

      <!-- 底部双胶囊入口 -->
      <button class="entry-btn" id="btn-workbench">🛠 找伙伴创作<small>说想法，改游戏</small></button>
      <button class="entry-btn" id="btn-takehome">🏠 带回家</button>
    </div>

    <!-- 带回家弹层 -->
    <div class="overlay" id="takehome-overlay" hidden>
      <div class="modal">
        <h3>把工坊带回家</h3>
        <p>这段「存档码」就是你的工坊钥匙。把它发到爸妈手机上，打开工坊、输入存档码，你的小伙伴和作品就都在了。</p>
        <div class="code-box" id="code-box"></div>
        <div class="row">
          <button class="btn-copy" id="btn-copy">复制存档码</button>
          <button class="btn-close" id="btn-close">知道了</button>
        </div>
      </div>
    </div>

  </div>

<script>
(function () {
  'use strict';
  var STORAGE_KEY = 'jiahong-claim-v3';
  var CLAIM_BASE = '/claim_v1/';

  var WORKS = [
    { id:'star', title:'星星大冒险', type:'接星星游戏', cat:'创造与游戏', icon:'星', color:'#378ADD', status:'done', url:'/game_v1/' },
    { id:'math', title:'口算小工具', type:'帮我练口算', cat:'学习与教育', icon:'算', color:'#D4537E', status:'locked' },
    { id:'plan', title:'每日计划', type:'帮我不拖延', cat:'效率与习惯', icon:'计', color:'#1D9E75', status:'locked' },
    { id:'money', title:'零花钱管家', type:'帮我记账', cat:'生活与理财', icon:'钱', color:'#BA7517', status:'locked' },
  ];

  var CAT_ICONS = { '创造与游戏':'🎮', '学习与教育':'📚', '效率与习惯':'⏰', '生活与理财':'💰' };
  // cat=主类；将来横跨两类的"综合项目"作品再加 sub=副类，卡片会显示"主＋副"
  var RARITY_COLOR = { 'SSR':'#EF9F27', 'SR':'#7F77DD', 'R':'#378ADD', 'N':'#888780' };
  var RARITY_CN = { 'SSR':'传说', 'SR':'稀有', 'R':'优质', 'N':'普通' };

  function loadSave() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return null;
      var a = JSON.parse(raw);
      if (!a.owner || !a.owned || a.owned.length === 0) return null;
      return a;
    } catch (e) { return null; }
  }

  // ============ 存档码：压缩 + URL 安全短码（z.=deflate 压缩 / u.=不压缩），旧长码仍兼容 ============
  function bytesToB64url(bytes) {
    var bin = '';
    for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
    return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }
  function b64urlToBytes(s) {
    s = s.replace(/-/g, '+').replace(/_/g, '/');
    while (s.length % 4) s += '=';
    var bin = atob(s), out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }
  function utf8Bytes(str) { return new TextEncoder().encode(str); }
  function utf8String(bytes) { return new TextDecoder().decode(bytes); }
  function deflateBytes(bytes) {
    var stream = new Blob([bytes]).stream().pipeThrough(new CompressionStream('deflate'));
    return new Response(stream).arrayBuffer().then(function (b) { return new Uint8Array(b); });
  }
  function inflateBytes(bytes) {
    var stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate'));
    return new Response(stream).arrayBuffer().then(function (b) { return new Uint8Array(b); });
  }
  function makeCode(save) {
    var bytes = utf8Bytes(JSON.stringify(save));
    function plain() { return Promise.resolve('u.' + bytesToB64url(bytes)); }
    if (window.CompressionStream && window.DecompressionStream) {
      try {
        return deflateBytes(bytes).then(function (z) { return 'z.' + bytesToB64url(z); }, plain);
      } catch (e) { return plain(); }
    }
    return plain();
  }
  function restoreFromHash() {
    return new Promise(function (resolve) {
      try {
        var m = location.hash.match(/[#&]c=([^&]+)/);
        if (!m) return resolve(false);
        var s = m[1];
        function done(json) {
          try {
            var a = JSON.parse(json);
            if (!a.owner || !a.owned) return resolve(false);
            localStorage.setItem(STORAGE_KEY, JSON.stringify(a));
            resolve(true);
          } catch (e) { resolve(false); }
        }
        if (s.indexOf('z.') === 0) {
          inflateBytes(b64urlToBytes(s.slice(2))).then(function (b) { done(utf8String(b)); }, function () { resolve(false); });
        } else if (s.indexOf('u.') === 0) {
          done(utf8String(b64urlToBytes(s.slice(2))));
        } else {
          done(decodeURIComponent(escape(atob(s)))); // 兼容旧长码
        }
      } catch (e) { resolve(false); }
    });
  }

  function el(id) { return document.getElementById(id); }

  function render() {
    var save = loadSave();
    if (!save) {
      el('empty').hidden = false;
      el('main').hidden = true;
      return;
    }
    el('empty').hidden = true;
    el('main').hidden = false;

    var owner = save.owner || '小朋友';
    var hero = save.owned[0];           // 门口站着的伙伴 = 最早认领的那个
    var heroName = hero.name || hero.originalName || '伙伴';
    var rarity = hero.rarity || 'N';

    el('brand-name').textContent = owner + '的工坊';
    el('points-pill').textContent = '★ ' + (save.points || 0);
    el('partner-img').src = CLAIM_BASE + hero.img;
    el('top-avatar-img').src = CLAIM_BASE + hero.img;
    el('partner-name').textContent = heroName;
    var wbBtn = el('btn-workbench');
    if (wbBtn) {
      wbBtn.textContent = '';
      var t1 = document.createElement('span');
      t1.textContent = '🛠 找' + heroName + '创作';
      var t2 = document.createElement('small');
      t2.textContent = '说想法，改游戏';
      wbBtn.appendChild(t1);
      wbBtn.appendChild(t2);
    }
    el('rarity-text').textContent = RARITY_CN[rarity] || rarity;
    el('rarity-dot').style.background = RARITY_COLOR[rarity] || '#888780';

    // 台词
    var doneCount = 1; // 已解锁作品数（demo 里星星大冒险）
    var lines = [
      '嗨，' + owner + '！我是' + heroName + '，你的 AI 小伙伴，欢迎回到咱们的工坊～',
      '看，作品架上摆着你做过的每一件东西，都是你的本事。',
      '你亲手做的「星星大冒险」就在那儿，点进去玩一把？',
      '看到想做的，先记进愿望单，等我们把它排进课表，我陪你一起做。',
      '越做越满，这里就会越来越像你的小天地啦～',
    ];
    var lineIdx = 0;
    el('bubble-text').textContent = lines[0];
    function nextLine() {
      lineIdx = (lineIdx + 1) % lines.length;
      el('bubble-text').textContent = lines[lineIdx];
    }
    el('bubble').onclick = nextLine;
    el('partner-figure').onclick = nextLine;

    // 我的伙伴们
    var crew = el('crew');
    crew.innerHTML = '';
    save.owned.forEach(function (h, i) {
      var d = document.createElement('div');
      d.className = 'avatar' + (i === 0 ? ' current' : '');
      var im = document.createElement('img');
      im.src = CLAIM_BASE + h.img;
      im.alt = h.name;
      d.appendChild(im);
      d.title = h.name;
      d.onclick = function () { swapHero(i); };
      crew.appendChild(d);
    });

    // 积分进度
    var pts = save.points || 0;
    var GOAL = 240;   // 一期 8 节 × 每天最多 3 次 × 10 分
    el('progress-num').textContent = pts + ' / ' + GOAL;
    el('progress-fill').style.width = Math.min(pts / GOAL * 100, 100) + '%';

    // 作品架
    var shelf = el('shelf');
    shelf.innerHTML = '';
    WORKS.forEach(function (w) {
      var card = document.createElement('div');
      card.className = 'work ' + w.status;
      var badge = w.status === 'done' ? '已制作' : '📌 愿望单';
      var catChip = '';
      if (w.cat) {
        catChip = '<span class="work-cat" style="color:' + w.color + '">' + ((CAT_ICONS[w.cat] || '') + ' ' + w.cat) + (w.sub ? ' ＋ ' + ((CAT_ICONS[w.sub] || '') + ' ' + w.sub) : '') + '</span>';
      }
      card.innerHTML =
        '<div class="work-icon" style="background:' + w.color + '">' + w.icon + '</div>' +
        '<div class="work-title">' + w.title + '</div>' +
        '<div class="work-type">' + w.type + '</div>' +
        catChip +
        '<span class="work-badge">' + badge + '</span>';
      if (w.status === 'done') {
        card.onclick = function () { location.href = w.url; };
      } else {
        card.style.cursor = 'pointer';
        card.onclick = function () {
          var K = 'jiahong-wb-wishvote-v1';
          var votes = {};
          try { votes = JSON.parse(localStorage.getItem(K) || '{}'); } catch(e){}
          votes[w.title] = (votes[w.title] || 0) + 1;
          try { localStorage.setItem(K, JSON.stringify(votes)); } catch(e){}
          var badge = card.querySelector('.work-badge');
          if (badge) { badge.textContent = '🙋 已许愿 · 等排课'; badge.style.background = '#ffe8a3'; }
          card.onclick = null;
        };
      }
      shelf.appendChild(card);
    });
    loadInbox(save.owner);
    renderGrowth();
  }

  function renderGrowth(){
    var box = el('growth'), ttl = el('growth-title');
    if(!box) return;
    var save = loadSave();          // 原代码引用了 render() 的局部变量，作用域外 → 抛错 → 被空 catch 吞掉
    if(!save) return;
    var g = null, vers = [];
    try {
      var gr = JSON.parse(localStorage.getItem('jiahong-wb-growth-v1') || 'null');
      if(gr && gr.owner === save.owner) g = gr;
      var vr = JSON.parse(localStorage.getItem('jiahong-wb-versions-v1') || 'null');
      if(vr && vr.owner === save.owner) vers = vr.list || [];
    } catch(e){}
    if(!g && !vers.length){ if(ttl) ttl.hidden = true; box.hidden = true; return; }
    if(ttl) ttl.hidden = false;
    box.hidden = false;
    box.innerHTML = '';
    var nums = [];
    if(g){ nums.push('说出想法 ' + (g.sayCount||0) + ' 次'); nums.push('一次说清 ' + (g.oneShot||0) + ' 次'); nums.push('反复打磨 ' + (g.multiTurn||0) + ' 次'); nums.push('试错/撤销 ' + (g.undoCount||0) + ' 次'); nums.push('作品 ' + (g.versionCount||0) + ' 个'); }
    var n1 = document.createElement('div'); n1.className = 'inbox-item';
    var t1 = document.createElement('div'); t1.className = 'ii-text'; t1.textContent = '这些数字是孩子自己动手留下的脚印：' + (nums.join(' · ') || '还没有记录');
    n1.appendChild(t1); box.appendChild(n1);
    vers.slice(0, 3).forEach(function(v){
      var row = document.createElement('div'); row.className = 'inbox-item';
      var a = document.createElement('div'); a.className = 'ii-text'; a.textContent = '🎮 ' + v.name + (v.title ? '（' + v.title + '）' : '');
      var b2 = document.createElement('div'); b2.className = 'ii-sub';
      b2.textContent = v.why ? ('💬 孩子说：' + v.why) : '（这版还没写“孩子的话”）';
      row.appendChild(a); row.appendChild(b2); box.appendChild(row);
    });
  }

  function loadInbox(owner){
    var box = el('inbox'), ttl = el('inbox-title');
    if(!owner || !box){ if(ttl) ttl.hidden = true; if(box) box.hidden = true; return; }
    fetch('/api/suggest?owner=' + encodeURIComponent(owner)).then(function(r){ return r.json(); }).then(function(res){
      var list = (res && res.list) || [];
      if(!list.length){ if(ttl) ttl.hidden = true; box.hidden = true; return; }
      if(ttl) ttl.hidden = false;
      box.hidden = false;
      box.innerHTML = '';
      list.slice(0, 12).forEach(function(it){
        var d = new Date(it.ts);
        var timeStr = (d.getMonth()+1) + '月' + d.getDate() + '日';
        var row = document.createElement('div');
        row.className = 'inbox-item';
        var t1 = document.createElement('div'); t1.className = 'ii-text'; t1.textContent = it.text || '';
        var t2 = document.createElement('div'); t2.className = 'ii-sub';
        t2.textContent = (it.version ? ('对「' + it.version + '」') : '') + (it.hero ? (' · ' + it.hero) : '') + ' · ' + timeStr;
        row.appendChild(t1); row.appendChild(t2);
        box.appendChild(row);
      });
    }).catch(function(){ if(ttl) ttl.hidden = true; box.hidden = true; });
  }

  function swapHero(i) {
    var save = loadSave();
    if (!save) return;
    var h = save.owned[i];
    if (!h) return;
    save.owned.splice(i, 1);
    save.owned.unshift(h);
    localStorage.setItem(STORAGE_KEY, JSON.stringify(save));
    render();
  }

  // 带回家
  el('btn-takehome').addEventListener('click', function () {
    var save = loadSave();
    if (!save) return;
    el('takehome-overlay').hidden = false;
    el('code-box').textContent = '生成中…';
    makeCode(save).then(function (code) {
      el('code-box').textContent = code;
    });
  });

  el('btn-copy').addEventListener('click', function () {
    var text = el('code-box').textContent;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function(){ el('btn-copy').textContent = '已复制'; });
    } else {
      el('btn-copy').textContent = '长按上方复制';
    }
  });
  el('btn-close').addEventListener('click', function () { el('takehome-overlay').hidden = true; });
  el('takehome-overlay').addEventListener('click', function (e) {
    if (e.target === this) this.hidden = true;
  });

  el('btn-go-claim').addEventListener('click', function () { location.href = '/claim_v1/'; });
  var btnWorkbench = el('btn-workbench');
  if (btnWorkbench) btnWorkbench.addEventListener('click', function () { location.href = '/workbench_v1/'; });

  // 初始化：先尝试从 hash 恢复（带回家），再渲染
  restoreFromHash().then(function (restored) {
    if (restored && location.hash) {
      history.replaceState(null, '', location.pathname); // 清掉 hash
    }
    render();
  });

  // 初始化：先尝试从 hash 恢复（带回家），再渲染
  var restored = restoreFromHash();
  if (restored && location.hash) {
    history.replaceState(null, '', location.pathname); // 清掉 hash
  }
  render();
})();
</script>
</body>
</html>
