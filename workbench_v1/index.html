<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>制作台 · 和伙伴一起做</title>
<style>/* 制作台视觉重构 v2 —— 框架图底 + 真实 DOM 覆盖（坐标来自 layout.json 实测）
   舞台：9:16 固定比例，居中，其他屏幕比例上下/左右补 #F5E8CC（框架边缘色） */
[hidden]{display:none!important;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#F5E8CC;
  --card:#FFFBF2; --card-soft:#FBF3E2;
  --ink:#5B4636; --sub:#9A866E; --line:#E7D9BE;
  --brown:#A9744E; --brown-d:#8A5A3A; --gold:#D9AE6A; --gold-d:#B67B2E;
  --mint:#6FA98A; --gray:#B8A98F;
}
html,body{height:100%;}
body{
  font-family:"PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  color:var(--ink);
  background:var(--bg);
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  overflow:hidden;
}
.app{
  width:min(100vw, calc(100vh * 9 / 16));
  height:min(100vh, calc(100vw * 16 / 9));
  position:relative;
  background:url('/assets/frames/frame-workbench.png') center / 100% 100% no-repeat;
  container-type:size;
  overflow:hidden;
}
#main{position:absolute;inset:0;}
button{cursor:pointer;font-family:inherit;}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px dashed var(--gold-d);outline-offset:2px;}
.tool-btn:disabled{opacity:.35;filter:grayscale(.7);cursor:default;}

/* ===== 顶栏：返回圆钮 / 工具条五图标 / 积分条 ===== */
.btn-back{
  position:absolute;left:3.82%;top:2.29%;width:10.07%;height:6.79%;
  display:flex;align-items:center;justify-content:center;
  background:transparent;border:none;text-decoration:none;
}
.btn-back img{height:3.1cqh;width:auto;pointer-events:none;}
.btn-back:active{transform:scale(.92);}
.toolbar{
  position:absolute;left:15.5%;right:25.5%;top:2.29%;height:6.79%;
  display:flex;align-items:center;justify-content:space-evenly;
}
.tool-btn{
  background:transparent;border:none;padding:.4cqh;
  display:flex;align-items:center;justify-content:center;
  transition:transform .12s ease;
}
.tool-btn img{height:3.2cqh;width:auto;pointer-events:none;}
.tool-btn:active{transform:scale(.88);}
.points-pill{
  position:absolute;left:76.04%;top:2.29%;width:20.23%;height:6.79%;
  display:flex;align-items:center;justify-content:center;
  font-size:2.4cqh;font-weight:700;color:var(--gold-d);white-space:nowrap;
}
.points-pill.pop{animation:pillpop .6s ease;}
@keyframes pillpop{0%{transform:scale(1)}40%{transform:scale(1.12)}100%{transform:scale(1)}}

/* ===== 伙伴：圆形头像 + 名字/稀有度/状态 ===== */
.partner-avatar{
  position:absolute;left:4.35%;top:10.45%;width:12.5%;height:7.15%;
  border-radius:50%;overflow:hidden;
  display:flex;align-items:flex-start;justify-content:center;
}
.partner-avatar img{width:100%;height:100%;object-fit:cover;object-position:center 8%;}
.partner-info{
  position:absolute;left:19.6%;top:12.11%;width:74%;height:4.35%;
  display:flex;align-items:center;gap:1.2cqh;
  font-size:2.3cqh;
}
.partner-info b{font-size:2.5cqh;color:var(--ink);white-space:nowrap;}
.rarity-tag{font-size:1.5cqh;font-weight:700;padding:.3cqh 1cqh;border-radius:999px;color:#fff;white-space:nowrap;}
.status-dot{width:1.1cqh;height:1.1cqh;border-radius:50%;display:inline-block;flex:none;}
.status-on{background:var(--mint);}
.status-mock{background:var(--gold-d);}
.status-text{font-size:1.6cqh;color:var(--sub);white-space:nowrap;}

/* ===== 当前改动信息条（原 modbar 的按钮已上顶栏，这里只剩信息） ===== */
.modbar{
  position:absolute;left:7%;top:20.1%;width:86%;z-index:5;
  background:rgba(255,247,234,.96);
  border:1.5px dashed #E7C98A;border-radius:1.6cqh;
  padding:1cqh 1.6cqh;
  box-shadow:0 .6cqh 1.6cqh rgba(217,174,106,.18);
}
.mod-info{font-size:1.6cqh;color:var(--gold-d);line-height:1.5;}

/* ===== 聊天区（盖在框架图聊天面板内） ===== */
.chat{
  position:absolute;left:5.8%;top:19.9%;width:88.4%;height:60.4%;
  overflow-y:auto;overflow-x:hidden;
  padding:1.6cqh 1.2cqh 2cqh;
  display:flex;flex-direction:column;gap:1.8cqh;
  scrollbar-width:thin;scrollbar-color:#D9C6A0 transparent;
}
.chat::-webkit-scrollbar{width:6px;}
.chat::-webkit-scrollbar-thumb{background:#D9C6A0;border-radius:3px;}

/* 消息：头像在两侧，气泡尾巴指向头像（对齐设计稿） */
.msg{
  position:relative;
  max-width:76% !important;
  padding:1.05cqh 1.6cqh;
  border-radius:2.4cqh;
  font-size:2.1cqh;line-height:1.55;word-break:break-word;
  animation:pop .18s ease;
}
@keyframes pop{from{opacity:0;transform:translateY(.6cqh)}to{opacity:1;transform:none}}
.msg.ai{
  align-self:flex-start;margin-left:11.5cqw;
  background:#FBF3E2;border:2px solid #6E4F2E;color:var(--ink);
  box-shadow:0 .5cqh 1.2cqh rgba(110,79,46,.12);
}
.msg.me{
  align-self:flex-end;margin-right:11.5cqw;
  background:#D2D3AE;border:2px solid #5C542C;color:#3A2C1A;
  box-shadow:0 .5cqh 1.2cqh rgba(92,84,44,.14);
}
/* 气泡尾巴：外层描边三角 + 内层填充三角 */
.msg::before,.msg::after{content:'';position:absolute;width:0;height:0;border-style:solid;}
.msg.ai::before{
  left:-1.8cqh;top:1.45cqh;
  border-width:1.05cqh 1.45cqh 1.05cqh 0;
  border-color:transparent #6E4F2E transparent transparent;
}
.msg.ai::after{
  left:calc(-1.8cqh + 2.6px);top:1.45cqh;
  border-width:1.05cqh 1.45cqh 1.05cqh 0;
  border-color:transparent #FBF3E2 transparent transparent;
}
.msg.me::before{
  right:-1.8cqh;top:1.45cqh;
  border-width:1.05cqh 0 1.05cqh 1.45cqh;
  border-color:transparent transparent transparent #5C542C;
}
.msg.me::after{
  right:calc(-1.8cqh + 2.6px);top:1.45cqh;
  border-width:1.05cqh 0 1.05cqh 1.45cqh;
  border-color:transparent transparent transparent #D2D3AE;
}
/* meta 行折叠藏掉名字文字；头像拉到气泡外两侧 */
.msg .meta{margin:0;font-size:0;line-height:0;opacity:1;}
.msg.ai .meta{
  position:absolute;left:-11.5cqw;top:0;
  width:9cqw;height:9cqw;border-radius:50%;overflow:hidden;
  background:#F1E6CE;border:2px solid #6E4F2E;
  box-shadow:0 .4cqh 1cqh rgba(110,79,46,.18);
}
.msg.ai .msg-avatar{display:block;width:148%;margin:-4% 0 0 -24%;}
.msg.me .meta{
  position:absolute;right:-11.5cqw;top:0;
  width:9cqw;height:9cqw;border-radius:50%;
  background:#84845C url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4.2" fill="%23FFF8EA"/><path d="M3.5 20.5c1.2-4.2 4.6-6.3 8.5-6.3s7.3 2.1 8.5 6.3z" fill="%23FFF8EA"/></svg>') center/74% no-repeat;
  border:2px solid #5C542C;
  box-shadow:0 .4cqh 1cqh rgba(92,84,44,.18);
}
.msg-avatar{display:inline-block;}

.typing{display:inline-flex;gap:.5cqh;align-items:center;}
.typing i{width:.7cqh;height:.7cqh;border-radius:50%;background:var(--gray);animation:blink 1s infinite;}
.typing i:nth-child(2){animation-delay:.2s}
.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}

/* 改动卡片（翻译回执 + 应用/再改） */
.change-card{
  background:linear-gradient(180deg,#FFF8E9,#FBEED5);
  border:2px solid #6E4F2E;border-radius:2.4cqh;
  padding:1.6cqh 1.8cqh;
  box-shadow:0 1cqh 2.2cqh rgba(110,79,46,.20);
  max-width:92%;
}
.change-card .cc-head{display:flex;align-items:center;gap:.8cqh;margin-bottom:.8cqh;}
.change-card .cc-head b{font-size:2.2cqh;color:var(--brown-d);}
.change-card .cc-summary{font-size:1.95cqh;color:var(--ink);margin-bottom:1cqh;line-height:1.6;}
.change-card .cc-receipt{
  font-size:1.75cqh;color:#8A6D3B;background:#FBF1DC;
  border:1.5px dashed #E7D2A8;border-radius:1.4cqh;
  padding:.9cqh 1.2cqh;margin-bottom:1.2cqh;line-height:1.6;
}
.change-card .cc-heard{font-size:1.7cqh;color:#8A6A3F;margin:-.6cqh 0 1cqh;}
.change-card .cc-actions{display:flex;gap:1cqh;}
@container (max-width: 440px){
  .change-card .cc-actions{flex-direction:column;}
}
.btn-apply{
  flex:1;border:none;border-radius:1.6cqh;padding:1.2cqh;
  font-size:2cqh;font-weight:700;color:#fff;
  background:linear-gradient(135deg,#D9AE6A,#B67B2E);
  box-shadow:0 .6cqh 1.4cqh rgba(182,123,46,.28);
}
.btn-play{
  flex:1;border:1.5px solid var(--brown);border-radius:1.6cqh;padding:1.2cqh;
  font-size:1.9cqh;font-weight:600;color:var(--brown);
  background:#fff;text-align:center;text-decoration:none;
  display:flex;align-items:center;justify-content:center;
}
.cc-note{margin:.2cqh .2cqh .4cqh;font-size:1.6cqh;color:#8A6A2F;background:#FFF3DD;border-radius:1.2cqh;padding:.7cqh 1.1cqh;display:inline-block;}

/* 选项气泡（AI 给的选择） */
.options{display:flex;flex-wrap:wrap;gap:.8cqh;margin:.2cqh 0 .4cqh;padding-left:.2cqh;}
.opt{
  background:linear-gradient(135deg,#C98A4B,#A9744E);border:none;border-radius:999px;
  padding:1cqh 1.8cqh;font-size:1.9cqh;font-weight:700;color:#fff;
  box-shadow:0 .4cqh 1.2cqh rgba(169,116,78,.25);animation:pop .2s ease;
}
.opt:active{transform:scale(.95);}

/* 愿望单卡片 */
.wish-card{
  background:#F7EED8;border:2px solid var(--brown);border-radius:2cqh;
  padding:1.3cqh 1.7cqh;box-shadow:0 .8cqh 1.8cqh rgba(169,116,78,.14);
  animation:pop .2s ease;max-width:92%;
}
.wish-card .wish-head{font-size:2cqh;font-weight:700;color:var(--brown);margin-bottom:.6cqh;}
.wish-card .wish-note{font-size:1.95cqh;color:var(--ink);margin-bottom:.6cqh;line-height:1.5;}
.wish-card .wish-sub{font-size:1.6cqh;color:var(--sub);}

/* ===== 提示 chips（点「没想法」后浮出） ===== */
.chips-label{
  position:absolute;left:6%;top:70.5%;width:88%;z-index:6;
  background:rgba(255,249,236,.96);border:1.5px dashed #D9C6A0;border-radius:1.4cqh;
  padding:.9cqh 1.4cqh;font-size:1.7cqh;color:#8A6A3F;line-height:1.5;
}
.chips{
  position:absolute;left:6%;top:74.8%;width:88%;max-height:6%;overflow-y:auto;z-index:6;
  display:flex;flex-wrap:wrap;gap:.8cqh;
  background:rgba(255,249,236,.96);border:1.5px dashed #D9C6A0;border-radius:1.4cqh;
  padding:1cqh 1.4cqh;
}
.chip{
  background:var(--card-soft);border:1.5px solid var(--line);border-radius:999px;
  padding:.8cqh 1.5cqh;font-size:1.8cqh;color:var(--brown);
  box-shadow:0 .2cqh .6cqh rgba(139,104,68,.05);
}
.chip:active{transform:scale(.96);}

/* ===== 「没想法点这里」条 ===== */
.help-ideas{
  position:absolute;left:4.17%;top:81.9%;width:91.75%;height:3.5%;
  background:transparent;border:none;
  font-size:1.9cqh;font-weight:600;color:#8A6A3F;
  display:flex;align-items:center;justify-content:center;
}
.help-ideas:active{transform:scale(.98);}

/* ===== 输入区（盖在框架图输入条/语音钮/发送钮上） ===== */
.input-overlay{
  position:absolute;left:3.82%;top:87.45%;width:58.59%;height:8.59%;
  border:none;outline:none;background:transparent;
  padding:0 2.4cqh 0 3.2cqh;
  font-size:2.2cqh;color:var(--ink);font-family:inherit;
}
.input-overlay::placeholder{color:#C0AE92;}
.btn-voice{
  position:absolute;left:64.24%;top:87.4%;width:14.67%;height:8.64%;
  background:transparent;border:none;
  display:flex;align-items:center;justify-content:center;
}
.btn-voice img{height:3.4cqh;width:auto;pointer-events:none;}
.btn-voice:active{transform:scale(.9);}
.btn-send{
  position:absolute;left:80.73%;top:87.11%;width:15.54%;height:9.08%;
  background:transparent;border:none;
  display:flex;align-items:center;justify-content:center;
}
.btn-send img{height:3.8cqh;width:auto;pointer-events:none;}
.btn-send:active{transform:scale(.9);}
.btn-send:disabled{opacity:.5;}

/* ===== 无存档空状态 ===== */
.empty{
  position:absolute;inset:0;z-index:8;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:8cqh 8%;
}
.empty .ghost{font-size:7cqh;margin-bottom:2cqh;}
.empty p{font-size:2.2cqh;color:var(--sub);line-height:1.8;margin-bottom:3cqh;}
.btn-primary{
  border:none;border-radius:2cqh;padding:1.6cqh 4cqh;
  font-size:2.4cqh;font-weight:600;color:#fff;
  background:linear-gradient(135deg,#D9AE6A,#B67B2E);
  box-shadow:0 .8cqh 1.8cqh rgba(182,123,46,.3);
}

/* ===== 弹窗（分享/版本/家长等，JS 动态生成） ===== */
.overlay{
  position:fixed;inset:0;background:rgba(60,42,26,.42);
  display:flex;align-items:center;justify-content:center;z-index:60;padding:18px;
}
.modal{
  background:#FFFBF0;border:1.5px solid var(--line);border-radius:22px;
  padding:20px;width:100%;max-width:430px;max-height:80vh;overflow:auto;
  box-shadow:0 12px 40px rgba(0,0,0,.22);
}
.modal h3{font-size:18px;font-weight:700;margin-bottom:6px;}
.modal .sub{font-size:13px;color:var(--sub);margin-bottom:12px;line-height:1.6;}
.ver-input{
  width:100%;border:1.5px solid var(--line);border-radius:12px;
  padding:11px 13px;font-size:15px;margin-bottom:12px;box-sizing:border-box;
  background:#fff;color:var(--ink);font-family:inherit;
}
.ver-actions{display:flex;gap:10px;}
.qr-wrap{margin:10px 0 4px;text-align:center;}
.qr-img{width:180px;height:180px;border-radius:14px;border:1.5px solid #F0E4C8;background:#fff;}
.qr-hint{font-size:12px;color:var(--sub);margin-top:6px;}
.ver-primary{
  flex:1;border:none;border-radius:14px;padding:13px;
  font-size:15px;font-weight:700;color:#fff;
  background:linear-gradient(135deg,#C98A4B,#A9744E);
}
.ver-ghost{
  flex:1;border:1.5px solid var(--line);border-radius:14px;padding:12px;
  font-size:14px;font-weight:600;color:var(--ink);background:#fff;
}
.ver-item{
  display:flex;align-items:center;gap:8px;
  border:1.5px solid var(--line);border-radius:14px;
  padding:10px 11px;margin-bottom:8px;background:#fff;
}
.ver-item .vi-info{flex:1;min-width:0;}
.ver-item .vi-name{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ver-item .vi-sub{font-size:12px;color:var(--sub);}
.ver-item .vi-why{font-size:13px;color:var(--brown);margin-top:3px;line-height:1.4;}
.vi-btn{border:none;border-radius:10px;padding:7px 9px;font-size:12px;font-weight:600;background:#F6EEDC;color:var(--brown);white-space:nowrap;}
.vi-btn.play{background:var(--mint);color:#fff;}
.vi-btn.del{background:#FDEBEA;color:#C0392B;}
.vi-btn.share{background:#E4F0FB;color:#2E86C1;}
.btn-skip{display:block;text-align:center;font-size:12px;color:var(--sub);margin-top:8px;text-decoration:underline;}
</style>
</head>
<body>
<div class="app">

  <!-- 无存档 -->
  <div id="empty" class="empty" hidden>
    <div class="ghost">🛠️</div>
    <p>还没有你的小伙伴。<br>先去认领一个，TA 才能陪你一起做东西。</p>
    <button class="btn-primary" id="btn-go-claim">去认领我的小伙伴</button>
  </div>

  <!-- 制作台主体 -->
  <div id="main" hidden>
    <a class="btn-back" href="/workshop_v1/" aria-label="回工坊"><img src="/assets/ui/icon-back.png" alt=""></a>

    <div class="toolbar">
      <button class="tool-btn" id="btn-undo" title="撤销上一步"><img src="/assets/ui/icon-undo.png" alt="撤销"></button>
      <button class="tool-btn" id="btn-save-version" title="把这版存起来"><img src="/assets/ui/icon-save.png" alt="保存版本"></button>
      <button class="tool-btn" id="btn-versions" title="我的版本"><img src="/assets/ui/icon-history.png" alt="历史版本"></button>
      <button class="tool-btn" id="btn-reset" title="还原游戏"><img src="/assets/ui/icon-redo.png" alt="还原"></button>
      <button class="tool-btn" id="btn-share-quick" title="分享二维码"><img src="/assets/ui/icon-qrcode.png" alt="分享"></button>
    </div>

    <span class="points-pill" id="points-pill">★ 0</span>

    <div class="partner-avatar"><img id="partner-img" alt="伙伴"></div>
    <div class="partner-info">
      <b id="partner-name"></b>
      <span class="rarity-tag" id="rarity-tag"></span>
      <span class="status-dot status-on" id="status-dot"></span>
      <span class="status-text" id="status-text">小伙伴在线</span>
    </div>

    <div class="modbar" id="modbar" hidden>
      <div class="mod-info" id="mod-info"></div>
    </div>

    <div class="chat" id="chat"></div>

    <div class="chips-label" id="chips-label" hidden>💡 没想法也没关系，点一个当聊天开头——具体改什么，还是你说了算</div>
    <div class="chips" id="chips" hidden></div>

    <button class="help-ideas" id="btn-help-ideas">😶 我还没想好，让伙伴陪我出出主意</button>

    <input type="text" id="input" class="input-overlay" maxlength="80" placeholder="告诉伙伴你想怎么改游戏…">
    <button class="btn-voice" id="btn-voice" aria-label="语音"><img src="/assets/ui/icon-mic.png" alt=""></button>
    <button class="btn-send" id="btn-send" aria-label="发送"><img src="/assets/ui/icon-send.png" alt=""></button>
  </div>

</div>

<script src="qrcode.min.js"></script>
<script>
(function () {
  'use strict';
  var STORAGE_KEY = 'jiahong-claim-v3';
  var MODS_KEY = 'jiahong-mods';
  var HISTORY_KEY = 'jiahong-wb-history-v1';
  var EARN_KEY = 'jiahong-wb-earn';
  var WISH_KEY = 'jiahong-wb-wishlist-v1';
  var VERSIONS_KEY = 'jiahong-wb-versions-v1';
  var GROWTH_KEY = 'jiahong-wb-growth-v1';
  var PARENT_KEY = 'jiahong-wb-parent-v1';
  var CHATLOG_KEY = 'jiahong-wb-chatlog-v1';
  var SESSION_OWNER_KEY = 'jiahong-wb-session-owner';
  var CLAIM_BASE = '/claim_v1/';
  var MAKE_POINTS = 10;
  var MAX_EARN_DAY = 3;

  var RARITY_COLOR = { 'SSR':'#EF9F27', 'SR':'#7F77DD', 'R':'#378ADD', 'N':'#888780' };
  var RARITY_CN = { 'SSR':'传说', 'SR':'稀有', 'R':'优质', 'N':'普通' };
  var MOD_KEYS = ['star_speed','star_size','spawn_interval','gold_chance','bomb_chance','magnet','extra_life','catcher_scale','title','star_spawn','auto_fire','vehicle'];

  var history = [];   // 会话内对话（发给后端）
  var save = null, hero = null;
  var busy = false;
  var teacherMode = /[?&]teacher=1/.test(location.search);

  function el(id){ return document.getElementById(id); }

  // ---------- 音效 ----------
  var Sfx = (function(){
    var ctx = null;
    function ac(){
      if(!ctx){ try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){} }
      if(ctx && ctx.state === 'suspended'){ try { ctx.resume(); } catch(e){} }
      return ctx;
    }
    function tone(f, d, type, vol, when){
      try{
        var a = ac(); if(!a) return;
        var o = a.createOscillator(), g = a.createGain();
        o.type = type || 'sine'; o.frequency.value = f;
        var t = a.currentTime + (when || 0);
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(vol || 0.08, t + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t + d);
        o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + d + 0.05);
      }catch(e){}
    }
    return {
      send: function(){ tone(520, .08, 'triangle', .05); },
      reply: function(){ tone(660, .1, 'triangle', .06); setTimeout(function(){ tone(880, .12, 'triangle', .05); }, 90); },
      apply: function(){ tone(523, .1, 'triangle', .07); setTimeout(function(){ tone(784, .1, 'triangle', .07); }, 90); setTimeout(function(){ tone(1047, .18, 'triangle', .07); }, 180); },
      undo: function(){ tone(392, .14, 'sine', .06); setTimeout(function(){ tone(330, .16, 'sine', .05); }, 100); },
      coins: function(){ tone(880, .08, 'square', .03); setTimeout(function(){ tone(1175, .1, 'square', .03); }, 80); setTimeout(function(){ tone(1568, .16, 'square', .03); }, 170); },
      error: function(){ tone(196, .2, 'sawtooth', .04); },
    };
  })();

  var MOD_DEFS = { star_speed:2.2, star_size:26, spawn_interval:900, gold_chance:0.08, bomb_chance:0, magnet:false, extra_life:0, catcher_scale:1, title:'', duration:60, star_spawn:true, auto_fire:false, vehicle:'' };
  function n2(v){ if (v === null || v === undefined || v === '') return '默认'; var n = Number(v); return isNaN(n) ? String(v) : (Math.round(n*100)/100); }
  function receiptText(changes, patch, script){
    var parts = [];
    var cur = loadMods();
    (changes || []).forEach(function(c){
      if (!c || c.key === undefined) return;
      var oldV = (cur && cur[c.key] !== undefined) ? cur[c.key] : MOD_DEFS[c.key];
      var nv = c.value;
      if (c.key === 'star_speed') { parts.push('星星速度 ' + n2(oldV) + ' → ' + n2(nv)); }
      else if (c.key === 'star_size') { parts.push('星星大小 ' + n2(oldV) + ' → ' + n2(nv)); }
      else if (c.key === 'spawn_interval') { parts.push('星星出现间隔 ' + n2(oldV) + ' → ' + n2(nv) + ' 毫秒'); }
      else if (c.key === 'gold_chance') { parts.push('金星星概率约 ' + Math.round((Number(nv)||0)*100) + '%'); }
      else if (c.key === 'bomb_chance') { parts.push('炸弹星概率约 ' + Math.round((Number(nv)||0)*100) + '%'); }
      else if (c.key === 'magnet') { parts.push(nv ? '磁铁 开' : '磁铁 关'); }
      else if (c.key === 'extra_life') { parts.push('额外生命 +' + n2(nv)); }
      else if (c.key === 'catcher_scale') { parts.push('接星宽度倍率 ' + n2(oldV) + ' → ' + n2(nv)); }
      else if (c.key === 'title') { parts.push('游戏名改为「' + nv + '」'); }
      else if (c.key === 'duration') { parts.push('一局时长 ' + n2(nv) + ' 秒'); }
      else if (c.key === 'star_spawn') { parts.push(nv ? '保留星星' : '撤掉所有星星'); }
      else if (c.key === 'auto_fire') { parts.push(nv ? '子弹自动发射' : '子弹手动发射'); }
      else if (c.key === 'vehicle') { parts.push('坐骑改为「' + nv + '」'); }
    });
    if (patch) {
      if (patch.attack) parts.push('能发射攻击光弹');
      (patch.entities || []).forEach(function(e){
        if (!e) return;
        if (e.kind === 'bad') parts.push('新坏蛋：' + (e.emoji || '👾'));
        else if (e.kind === 'gold') parts.push('新奖励：' + (e.emoji || '🌟'));
        else if (e.kind) parts.push('新道具：' + (e.emoji || '✨'));
      });
    }
    if (typeof script === 'string' && script.trim()) parts.push('AI 给你写了一段新玩法 ✨');
    return parts.join('；');
  }

  // ---------- 改造：应用 / 撤销 / 还原 ----------
  function deepClone(o){ try { return JSON.parse(JSON.stringify(o)); } catch(e){ return o; } }
  function snapshotState(mods){
    var o = {};
    Object.keys(mods).forEach(function(k){ if(k !== '_undo' && k !== 'history') o[k] = deepClone(mods[k]); });
    return o;
  }
  function applyChanges(changes, patch, script, btn){
    var hasCh = changes && changes.length > 0;
    var hasPa = !!(patch && (patch.attack || (patch.entities && patch.entities.length)));
    var hasSc = (typeof script === 'string' && script.trim()) ? true : false;
    if(!hasCh && !hasPa && !hasSc) return;
    var mods = loadMods();
    if(!mods._undo) mods._undo = [];
    mods._undo.push(snapshotState(mods));
    if(mods._undo.length > 10) mods._undo.shift();
    if(hasCh) changes.forEach(function(c){ mods[c.key] = c.value; });
    if(hasPa) mods.patch = deepClone(patch);
    if(hasSc) mods.script = script;
    if(!mods.history) mods.history = [];
    mods.history.push({ summary: '改造', time: Date.now() });
    var sinceTyped = 0, typedSeen = false;
    var si = history.length - 1;
    while (si >= 0 && history[si].role === 'assistant') si--;
    for (; si >= 0; si--) {
      var hm = history[si];
      if (hm.role === 'user') {
        if ((hm.src || 'type') !== 'option') { sinceTyped++; typedSeen = true; }
        continue;
      }
      if (hm.role === 'assistant') { try { var sj = JSON.parse(hm.content); if (sj.action === 'modify') break; } catch(e){} }
    }
    // 只统计孩子自己组织语言说出的请求；点选项/标签不算（那是 AI 给的方向）
    if (typedSeen) bumpGrowth(sinceTyped <= 1 ? 'oneShot' : 'multiTurn');
    bumpGrowth('applyCount');
    localStorage.setItem(MODS_KEY, JSON.stringify(mods));

    btn.textContent = '✅ 已应用！点这里去玩新版本';
    btn.onclick = function(){ location.href = '/game_v1/'; };
    Sfx.apply();
    refreshModbar();
    var award = awardMake();
    addMsg('ai', award.cap
      ? '改好啦！（今天的制作分已经赚满啦，明天继续赚～）去玩新版本看看效果吧！'
      : '改好啦！这次动手"制作"赚了 ★' + MAKE_POINTS + '，去玩新版本看看效果吧！');
  }

  function humanLines(mods){
    var L = [];
    function has(k){ return mods[k] !== undefined && mods[k] !== null; }
    if(has('title')) L.push('名字「' + String(mods.title) + '」');
    if(has('star_speed')){ var v = Number(mods.star_speed); L.push('速度' + (v <= 1.6 ? '慢很多' : v <= 2.0 ? '慢一点' : v <= 2.5 ? '正常' : v <= 3.2 ? '快一点' : '很快')); }
    if(has('star_size')){ var s = Number(mods.star_size); L.push('星星' + (s <= 22 ? '变小' : s <= 30 ? '正常' : '变大')); }
    if(has('spawn_interval')){ var iv = Number(mods.spawn_interval); L.push('星星数量' + (iv <= 600 ? '很多' : iv <= 1200 ? '正常' : '少')); }
    if(has('gold_chance') && Number(mods.gold_chance) > 0.01) L.push('金星星更多');
    if(has('bomb_chance') && Number(mods.bomb_chance) > 0.01) L.push('有炸弹星');
    if(mods.magnet === true) L.push('磁铁开启');
    if(has('extra_life') && Number(mods.extra_life) > 0) L.push('多' + Number(mods.extra_life) + '条命');
    if(has('catcher_scale') && Number(mods.catcher_scale) > 1.05) L.push('接得更宽');
    if(has('duration') && Number(mods.duration) !== 60) L.push('本局 ' + Number(mods.duration) + ' 秒');
    if(has('star_spawn') && mods.star_spawn === false) L.push('不要星星');
    if(mods.auto_fire === true) L.push('子弹自动发射');
    if(has('vehicle') && mods.vehicle) L.push('坐骑 ' + mods.vehicle);
    if(mods.patch){
      if(mods.patch.attack) L.push('能发射光弹');
      (mods.patch.entities || []).forEach(function(en){
        var txt = en.text || en.label || '';
        if(en.kind === 'bad') L.push('坏蛋' + (txt ? ' ' + txt : ''));
        else if(en.kind === 'power') L.push('道具' + (txt ? ' ' + txt : '') + '(' + (en.power || '') + ')');
        else if(en.kind === 'gold') L.push('金星星');
        else if(txt) L.push(txt);
      });
    }
    if(typeof mods.script === 'string' && mods.script.trim()) L.push('AI 写了一段新玩法 ✨');
    return L;
  }
  function realMods(mods){ return MOD_KEYS.some(function(k){ return mods[k] !== undefined; }) || mods.duration !== undefined || !!(mods.patch && (mods.patch.attack || (mods.patch.entities && mods.patch.entities.length))) || (typeof mods.script === 'string' && mods.script.trim()); }
  function refreshModbar(){
    var bar = el('modbar');
    if(!bar) return;
    var mods = loadMods();
    var lines = humanLines(mods);
    var hasAny = realMods(mods);

      el('mod-info').textContent = '';

      el('btn-reset').disabled = true;
      return;

    el('mod-info').textContent = '我的游戏现在：' + lines.join(' · ');
    el('btn-undo').disabled = !((mods._undo || []).length);

  }
  function doUndo(){
    var mods = loadMods();
    var stack = mods._undo || [];
    if(!stack.length) return;
    var prev = stack.pop() || {};
    var next = {};
    Object.keys(prev).forEach(function(k){ next[k] = prev[k]; });
    next._undo = stack;
    if(mods.history && mods.history.length) next.history = mods.history.slice(0, -1);
    localStorage.setItem(MODS_KEY, JSON.stringify(next));
    Sfx.undo();
    refreshModbar();
    bumpGrowth('undoCount');
    addMsg('ai', '撤销好啦，游戏回到上一步的样子。还想怎么改？');
  }

  // ---------- 分享：版本 → 专属短链接 ----------
  function verB64(bytes){ var bin=''; for(var i=0;i<bytes.length;i++) bin += String.fromCharCode(bytes[i]); return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
  function makeVersionLink(v){
    var payload = { n: v.name, o: save ? save.owner : '', w: v.why || '', h: (hero && save && save.owned && save.owned[0]) ? { name: hero.name, originalName: hero.originalName, rarity: hero.rarity, img: hero.img } : null, m: v.mods || {} };
    return fetch('/api/share', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ payload: payload }) })
      .then(function(r){ return r.json(); })
      .then(function(res){
        if (res.ok && res.code) return location.origin + '/game_v1/?s=' + res.code;
        throw new Error('share failed');
      })
      .catch(function(){
        var bytes = new TextEncoder().encode(JSON.stringify(payload));
        if (window.CompressionStream) {
          try {
            var stream = new Blob([bytes]).stream().pipeThrough(new CompressionStream('deflate'));
            return new Response(stream).arrayBuffer().then(function(buf){ return location.origin + '/game_v1/?v=' + 'z.' + verB64(new Uint8Array(buf)); });
          } catch(e){}
        }
        return Promise.resolve(location.origin + '/game_v1/?v=' + 'u.' + verB64(bytes));
      });
  }

        } catch(e){ qrWrap.innerHTML = '<div class="qr-hint">复制上面链接发给他也能玩</div>'; }
      }
      ov.querySelector('#share-close').addEventListener('click', function(){ ov.remove(); });
      ov.querySelector('#share-copy').addEventListener('click', function(){
        inp.focus(); inp.select();
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(link).then(function(){
            var b = ov.querySelector('#share-copy'); b.textContent = '✅ 已复制！';
            setTimeout(function(){ ov.remove(); }, 900);
          });
        } else {
          var ok = false; try { ok = document.execCommand('copy'); } catch(e){}
          var b = ov.querySelector('#share-copy'); b.textContent = ok ? '✅ 已复制！' : '请长按输入框复制';
          setTimeout(function(){ ov.remove(); }, 1200);
        }
      });
    });
  }

  function openOverlay(html){
    var ov = document.createElement('div');
    ov.className = 'overlay';
    ov.innerHTML = '<div class="modal">' + html + '</div>';
    ov.addEventListener('click', function(e){ if(e.target === ov) ov.remove(); });
    document.body.appendChild(ov);
    return ov;
  }
  function openSaveVersion(){
    var list = loadVersions() || [];
    var ov = openOverlay(
      '<h3>📦 把这版存起来</h3>' +
      '<div class="sub">给这一版起个名字吧（比如：我的怪兽版、慢速版）</div>' +
      '<input class="ver-input" id="ver-name" maxlength="12" placeholder="版本 ' + (list.length + 1) + '">' +
      '<textarea class="ver-input" id="ver-why" rows="2" maxlength="60" placeholder="这版为什么酷？写一句话，会跟着作品一起分享出去（比如：加了会飞的怪兽，超刺激！）"></textarea>' +
      '<div class="ver-actions"><button class="ver-ghost" id="ver-cancel">取消</button><button class="ver-primary" id="ver-ok">保存</button></div>'
    );
    var inp = ov.querySelector('#ver-name');
    inp.value = '版本 ' + (list.length + 1);
    setTimeout(function(){ inp.focus(); inp.select(); }, 60);
    ov.querySelector('#ver-cancel').addEventListener('click', function(){ ov.remove(); });
    ov.querySelector('#ver-ok').addEventListener('click', function(){
      var name = inp.value.trim() || ('版本 ' + (list.length + 1));
      var why = (ov.querySelector('#ver-why') ? ov.querySelector('#ver-why').value : '').trim().slice(0, 60);
      var payload = payloadMods();
      list.unshift({ id: Date.now() + '-' + Math.floor(Math.random() * 999), name: name, ts: Date.now(), mods: payload, title: (payload.title || ''), why: why });
      if(list.length > 30) list = list.slice(0, 30);
      bumpGrowth('versionCount');
      saveVersions(list);
      ov.remove();
      var b = el('btn-save-version');
      b.textContent = '✅ 已存「' + name + '」';
      setTimeout(function(){ b.textContent = '📦 把这版存起来'; }, 1800);
    });
  }
  function openVersionList(){
    var list = loadVersions() || [];
    var items = list.length
      ? list.map(function(v, idx){
          var d = new Date(v.ts);
          var dateStr = (d.getMonth()+1) + '月' + d.getDate() + '日 ' + (d.getHours()<10?'0':'') + d.getHours() + ':' + (d.getMinutes()<10?'0':'') + d.getMinutes();
          return '<div class="ver-item"><div class="vi-info"><div class="vi-name">' + esc(v.name) + (v.title ? ' · ' + esc(v.title) : '') + '</div><div class="vi-sub">' + dateStr + '</div>' + (v.why ? '<div class="vi-why">💬 ' + esc(v.why) + '</div>' : '') + '</div>' +
            '<button class="vi-btn play" data-i="' + idx + '">▶ 玩</button>' +
            '<button class="vi-btn" data-load="' + idx + '">改</button>' +
            '<button class="vi-btn del" data-del="' + idx + '">删</button>' +
            '<button class="vi-btn share" data-share="' + idx + '">🔗 分享</button></div>';
        }).join('')
      : '<div class="sub">还没有存过版本。改出满意的一版后，点上面的「📦 把这版存起来」。</div>';
    var ov = openOverlay(
      '<h3>📁 我的版本</h3>' +
      '<div class="sub">「▶ 玩」=直接玩这一版；「改」=回到这一版继续改；「删」=删除。</div>' +
      items +
      '<div style="margin-top:10px;text-align:center;"><button class="ver-ghost" id="ver-close" style="max-width:130px;">关闭</button></div>'
    );
    ov.querySelector('#ver-close').addEventListener('click', function(){ ov.remove(); });
    ov.querySelectorAll('[data-i]').forEach(function(b){
      b.addEventListener('click', function(){
        var v = list[Number(b.getAttribute('data-i'))];
        if(!v) return;
        localStorage.setItem(MODS_KEY, JSON.stringify(deepClone(v.mods)));
        location.href = '/game_v1/';
      });
    });
    ov.querySelectorAll('[data-load]').forEach(function(b){
      b.addEventListener('click', function(){
        var v = list[Number(b.getAttribute('data-load'))];
        if(!v) return;
        localStorage.setItem(MODS_KEY, JSON.stringify(deepClone(v.mods)));
        ov.remove();
        refreshModbar();
        addMsg('ai', '换到「' + v.name + '」啦！可以继续改，满意了记得再存一版～');
      });
    });
    ov.querySelectorAll('[data-share]').forEach(function(b){
      b.addEventListener('click', function(){
        var v = list[Number(b.getAttribute('data-share'))];
        if(v) openShare(v);
      });
    });
    ov.querySelectorAll('[data-del]').forEach(function(b){
      b.addEventListener('click', function(){
        var idx = Number(b.getAttribute('data-del'));
        list.splice(idx, 1);
        saveVersions(list);
        ov.remove();
        openVersionList();
      });
    });
  }

  // ---------- 成长档案 & 家长模式 ----------
  function loadGrowth(){
    try {
      var raw = localStorage.getItem(GROWTH_KEY);
      if(!raw) return null;
      var o = JSON.parse(raw);
      if(!o || o.owner !== save.owner) return null;
      return o;
    } catch(e){ return null; }
  }
  function bumpGrowth(k){
    var g = loadGrowth() || { owner: save ? save.owner : '', sayCount: 0, oneShot: 0, multiTurn: 0, undoCount: 0, versionCount: 0, applyCount: 0, updated: 0 };
    g[k] = (g[k] || 0) + 1;
    g.updated = Date.now();
    try { localStorage.setItem(GROWTH_KEY, JSON.stringify(g)); } catch(e){}
  }
  function loadParent(){
    var def = { owner: save ? save.owner : '', aiOff: false, dayLimit: 200, allowShare: true };
    try {
      var raw = localStorage.getItem(PARENT_KEY);
      if(!raw) return def;
      var o = JSON.parse(raw);
      if(!o || o.owner !== save.owner) return def;
      return { owner: o.owner, aiOff: !!o.aiOff, dayLimit: Math.max(0, Number(o.dayLimit) || 200), allowShare: o.allowShare !== false };
    } catch(e){ return def; }
  }
  function saveParent(p){
    try { localStorage.setItem(PARENT_KEY, JSON.stringify(p)); } catch(e){}
  }
  function chatDay(){ var d = new Date(); return d.getFullYear() + '-' + (d.getMonth()+1) + '-' + d.getDate(); }
  function chatUse(){
    var owner = save ? save.owner : '';
    try {
      var raw = localStorage.getItem(CHATLOG_KEY);
      var o = raw ? JSON.parse(raw) : null;
      if(!o || o.date !== chatDay() || o.owner !== owner) o = { owner: owner, date: chatDay(), n: 0 };
      return o;
    } catch(e){ return { owner: owner, date: chatDay(), n: 0 }; }
  }
  function chatGuardMsg(){
    var p = loadParent();
    if (p.aiOff) { addMsg('ai', 'AI 聊天被家长暂时关掉了，先去玩你的游戏吧～'); return true; }
    var use = chatUse();
    if (use.n >= p.dayLimit) { addMsg('ai', '今天和伙伴聊天已经到上限啦（家长设置的），明天再来继续做吧～'); return true; }
    return false;
  }
  function markChatUsed(){
    try {
      var use = chatUse();
      use.n += 1;
      localStorage.setItem(CHATLOG_KEY, JSON.stringify(use));
    } catch(e){}
  }
  function parentGate(cb){
    var K = 'jiahong-wb-parentpin-v1';
    var saved = null;
    try { saved = localStorage.getItem(K); } catch(e){}
    if (!saved) {
      var set = prompt('第一次使用家长模式，请设一个 4 位数字密码（以后打开要输入）：');
      if (!set || !/^\d{4}$/.test(set)) { alert('密码要 4 位数字哦。'); return; }
      try { localStorage.setItem(K, set); } catch(e){}
      cb(); return;
    }
    var input = prompt('请输入家长模式密码：');
    if (input !== saved) { alert('密码不对～'); return; }
    cb();
  }
  function openParentPanel(){
    if (!save) return;
    var p = loadParent();
    var g = loadGrowth();
    var hist = loadHistoryMemo() || [];
    var chatRows = hist.slice(-10).map(function(m){
      var who = m.role === 'user' ? '孩子' : (hero ? hero.name : '伙伴');
      var txt = m.content;
      try { var j = JSON.parse(m.content); if (j.reply) txt = j.reply; } catch(e){}
      return '<div class="ii-text">' + esc(who) + '：' + esc(String(txt).slice(0, 60)) + '</div>';
    }).join('');
    var gHtml = g ? ['说出想法 ' + (g.sayCount||0) + ' 次','一次说清 ' + (g.oneShot||0) + ' 次','反复打磨 ' + (g.multiTurn||0) + ' 次','试错/撤销 ' + (g.undoCount||0) + ' 次','作品 ' + (g.versionCount||0) + ' 个','应用改造 ' + (g.applyCount||0) + ' 次'].join(' · ') : '（还没有记录）';
    var ov = openOverlay(
      '<h3>👨‍👩‍👧 家长模式</h3>' +
      '<div class="sub">管住 AI 聊天、控制作品公开、看孩子最近的对话与成长。</div>' +
      '<div class="ver-item" style="display:block;"><b>AI 聊天</b><label style="display:flex;gap:8px;margin-top:6px;align-items:center;"><input type="checkbox" id="par-aioff"' + (p.aiOff ? ' checked' : '') + '> 关闭（孩子先玩成品，不跟 AI 聊）</label></div>' +
      '<div class="ver-item" style="display:block;"><b>每天对话上限</b><input class="ver-input" id="par-limit" type="number" min="0" max="500" value="' + p.dayLimit + '" style="margin-top:6px;"></div>' +
      '<div class="ver-item" style="display:block;"><b>允许把作品分享到公开链接</b><label style="display:flex;gap:8px;margin-top:6px;align-items:center;"><input type="checkbox" id="par-share"' + (p.allowShare ? ' checked' : '') + '> 允许</label></div>' +
      '<div class="sub" style="margin-top:6px;">📈 成长档案：' + gHtml + '</div>' +
      (chatRows ? '<div class="sub" style="margin-top:8px;">🕘 最近对话（最近10条）：</div>' + chatRows : '') +
      '<div class="ver-actions" style="margin-top:10px;"><button class="ver-ghost" id="par-cancel">关闭</button><button class="ver-primary" id="par-save">保存设置</button></div>'
    );
    ov.querySelector('#par-cancel').addEventListener('click', function(){ ov.remove(); });
    ov.querySelector('#par-save').addEventListener('click', function(){
      var np = { owner: save.owner,
        aiOff: ov.querySelector('#par-aioff').checked,
        dayLimit: Math.max(0, Number(ov.querySelector('#par-limit').value) || 0),
        allowShare: ov.querySelector('#par-share').checked };
      saveParent(np);
      ov.remove();
      addMsg('ai', '家长设置已保存～');
    });
  }

  // ---------- 与 AI 对话 ----------
  function requestAI(){
    if(busy) return;
    busy = true;
    var typing = addTyping();
    var btn = el('btn-send');
    btn.disabled = true;

    var payload = {
      messages: history.slice(-24),
      owner: save ? save.owner : '小朋友',
      hero: hero ? { name: hero.name, originalName: hero.originalName, rarity: hero.rarity, personality: hero.personality } : null,
    };

    fetch('/api/chat', {
      method:'POST',
      headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify(payload),
    }).then(function(r){ return r.json(); })
      .then(function(res){
        busy = false;
        typing.remove();
        btn.disabled = false;
        var reply = res.reply || '';
        if(res.action === 'modify'){
          history.push({ role:'assistant', content: JSON.stringify({ action:'modify', reply:reply, summary:res.summary, changes:res.changes, patch:(res.patch||null), script:(res.script||null) }) });
          addChangeCard(reply, res.summary, res.changes, res.patch, res.script, res.heardCount);
        } else if(res.action === 'wish'){
          history.push({ role:'assistant', content: JSON.stringify({ action:'wish', reply:reply, note:(res.note||''), options:(res.options||[]) }) });
          addMsg('ai', reply);
          addWishCard(res.note || reply);
        } else {
          history.push({ role:'assistant', content: JSON.stringify({ action:'ask', reply:reply, options:(res.options||[]) }) });
          addMsg('ai', reply);
        }
        if(res.options && res.options.length){
          addOptionRow(res.options);
        }
        persistHistory();
        Sfx.reply();
      })
      .catch(function(){
        busy = false;
        typing.remove();
        btn.disabled = false;
        Sfx.error();
        addMsg('ai', '哎呀，我卡了一下，你再说一遍好不好？');
      });
  }

  function sendText(text, src){
    if(busy) return;
    if (chatGuardMsg()) return;
    var input = el('input');
    text = (text == null ? input.value : String(text)).trim();
    if(!text) return;
    src = src || 'type';
    input.value = '';
    addMsg('me', text);
    history.push({ role:'user', content:text, src: src });
    if (src !== 'option') bumpGrowth('sayCount');
    markChatUsed();
    persistHistory();
    Sfx.send();
    requestAI();
  }
  function send(){ sendText(el('input').value); }

  function renderMemo(msgs){
    msgs.forEach(function(m){
      if(!m) return;
      if(m.role === 'user'){ addMsg('me', String(m.content || '')); return; }
      if(m.role !== 'assistant') return;
      var parsed = null;
      try { parsed = JSON.parse(m.content); } catch(e){}
      if(!parsed || !parsed.reply){ addMsg('ai', String(m.content || '')); return; }
      addMsg('ai', parsed.reply);
      if(parsed.action === 'modify'){ addArchivedNote(parsed.summary); }
      else if(parsed.action === 'wish' && parsed.note){ addArchivedNote('📌 愿望：' + parsed.note); }
    });
  }

  function clearSessionForNewKid(){
    if(!save) return;
    var last = null;
    try { last = localStorage.getItem(SESSION_OWNER_KEY) || ''; } catch(e){}
    if(last === save.owner) return;
    try {
      [MODS_KEY, EARN_KEY, CHATLOG_KEY, HISTORY_KEY].forEach(function(k){ localStorage.removeItem(k); });
      localStorage.setItem(SESSION_OWNER_KEY, save.owner);
    } catch(e){}
  }
  function init(){
    save = loadSave();
    if(!save){
      el('empty').hidden = false;
      el('main').hidden = true;
      el('btn-go-claim').addEventListener('click', function(){ location.href = '/claim_v1/'; });
      return;
    }
    clearSessionForNewKid();
    el('empty').hidden = true;
    el('main').hidden = false;
    el('main').style.display = 'flex';

    hero = save.owned[0];
    var heroName = hero.name || hero.originalName || '伙伴';
    var rarity = hero.rarity || 'N';

    refreshPoints(false);
    el('points-pill').title = '积分用来抽新伙伴、升级伙伴（去扭蛋机）';
    el('partner-img').src = CLAIM_BASE + hero.img;
    el('partner-name').textContent = heroName;
    var tag = el('rarity-tag');
    tag.textContent = RARITY_CN[rarity] || rarity;
    tag.style.background = RARITY_COLOR[rarity] || '#888780';

    // 状态：仅老师模式(?teacher=1)显示，儿童不显示
    if(!teacherMode){
      el('status-dot').style.display = 'none';
      el('status-text').style.display = 'none';
    } else {
      fetch('/api/health').then(function(r){ return r.json(); }).then(function(h){
        el('status-dot').className = 'status-dot ' + (h.mock ? 'status-mock' : 'status-on');
        el('status-text').textContent = h.mock ? '演示模式' : '小伙伴在线';
      }).catch(function(){});
    }

    // 快捷建议
    var CHIPS = [
      { label: '⚡ 速度',    text: '我想改改速度' },
      { label: '🌧️ 数量',    text: '我想改改星星的数量' },
      { label: '🔍 大小',    text: '我想改改星星的大小' },
      { label: '🎮 难度',    text: '我想改改难度' },
      { label: '⭐ 奖励',    text: '我想改改奖励' },
      { label: '🎭 角色',    text: '我想让角色变厉害' },
    ];
    var chips = el('chips');
    CHIPS.forEach(function(c){
      var b = document.createElement('button');
      b.className = 'chip';
      b.textContent = c.label;
      b.addEventListener('click', function(){ sendText(c.text, 'option'); });
      chips.appendChild(b);
    });

    // 默认不给方向菜单：孩子没想法时才展开（只当聊天开头，不当选项）
    el('chips').hidden = true;
    el('chips-label').hidden = true;
    var btnIdeas = el('btn-help-ideas');
    btnIdeas.addEventListener('click', function(){
      btnIdeas.hidden = true;
      el('chips-label').hidden = false;
      el('chips').hidden = false;
    });

    // 状态条按钮
    el('btn-undo').addEventListener('click', doUndo);
    el('btn-save-version').addEventListener('click', openSaveVersion);
    if (/[?&]parent=1/.test(location.search)) { setTimeout(function(){ parentGate(openParentPanel); }, 400); }
    el('btn-versions').addEventListener('click', openVersionList);
    el('btn-reset').addEventListener('click', doReset);
    refreshModbar();

    // 记忆续聊 or 开场白
    var memo = loadHistoryMemo();
    if(memo && memo.length){
      history = memo.slice();
      renderMemo(memo);
      addMsg('ai', '我们接着上次的聊～你现在的游戏' + (realMods(loadMods()) ? '已经改过一些啦，' : '还是最初的样子，') + '想再改点什么？');
    } else {
      addMsg('ai', '嗨，' + (save.owner || '小朋友') + '！我是' + heroName + '。你想让「星星大冒险」变得更好玩吗？告诉我，我帮你改出来～');
    }
    persistHistory();

    el('btn-voice').addEventListener('click', function(){ addMsg('ai', '语音说话还没学会呢，先打字告诉我吧～'); });
  el('btn-share-quick').addEventListener('click', function(){
    openShare({ name: (save && save.owner ? save.owner + '的游戏' : '我的游戏'), why: '', mods: payloadMods() });
  });
  el('btn-send').addEventListener('click', send);
    el('input').addEventListener('keydown', function(e){ if(e.key==='Enter' && !e.isComposing && e.keyCode!==229) send(); });
  }

  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
</script>
</body>
